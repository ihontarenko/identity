<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Identity</title>
<style>
  /* See 4xx.html for why this is a standalone file, not part of the React bundle. */
  :root {
    --paper: #FBF8F2; --card: #FFFEFA; --line: #E7E1D1;
    --ink: #2A2A29; --ink-3: #7C7B78; --accent: #1E78A4; --accent-ink: #155778;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1E2433; --card: #2C3550; --line: #333F58;
      --ink: #D8E4F0; --ink-3: #6880A0; --accent: #F0A030; --accent-ink: #F8C878;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink);
    font-family: "DM Sans", system-ui, sans-serif; padding: 24px;
  }
  .card {
    width: 100%; max-width: 400px; text-align: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 40px 32px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 32px rgba(0,0,0,.06);
  }
  .brandMark {
    width: 40px; height: 40px; margin: 0 auto 16px; border-radius: 8px;
    background: var(--accent); color: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; font-size: 18px;
  }
  h1 {
    font-family: "Space Grotesk", system-ui, sans-serif; font-size: 18px; font-weight: 600;
    margin: 0 0 8px;
  }
  p { color: var(--ink-3); font-size: 13.5px; margin: 0 0 24px; }
  a {
    display: inline-flex; align-items: center; justify-content: center; height: 38px; padding: 0 18px;
    background: var(--ink); color: var(--paper); border-radius: 10px;
    font-size: 13.5px; font-weight: 600; text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brandMark">I</div>
    <h1>Something went wrong</h1>
    <p>An unexpected error occurred on our end. Please try again in a moment.</p>
    <a href="/">Back to Identity</a>
  </div>
</body>
</html>
