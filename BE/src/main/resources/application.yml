spring:
  application:
    name: identity-api

  config:
    import: classpath:application-sensitive.yml

  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "${IDENTITY_ISSUER:http://localhost:9090}/login/oauth2/code/google"
            scope: email, profile
          github:
            redirect-uri: "${IDENTITY_ISSUER:http://localhost:9090}/login/oauth2/code/github"
            scope: read:user, user:email

  # MySQL is the no-flag default, the same shape every product in this workspace now uses. H2 used
  # to be the default here and is gone entirely: an H2 file running MODE=PostgreSQL made local dev
  # green against a dialect nothing is ever deployed on, so a MySQL-only failure was only ever
  # discovered later. PostgreSQL stays available as the opt-in `postgresql` profile below.
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:mysql://localhost:3306/identity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${IDENTITY_DB_USERNAME:identity}
    password: ${IDENTITY_DB_PASSWORD:identity}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: IDENTITY-POOL
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true
    # ⚠️ 0, and it is load-bearing rather than tidy. `baseline-on-migrate` baselines a NON-EMPTY schema
    # at `baseline-version`, which defaults to 1 — and Identity's first migration IS version 1, so it
    # would be skipped as "already applied". That never happened while this schema started empty. It
    # starts non-empty now: `jmouse-access-jpa` brings its own migrations and its own history table,
    # and they run first so the entity manager can validate against the tables they create.
    #
    # Found by booting this service against a fresh throwaway schema: V000002 died with "table
    # `identity_users` doesn't exist" — two steps from the cause, because the migration that creates it
    # had been silently marked as already applied. Tessera and Central each hit the identical failure.
    # At 0 the baseline sits below everything and every migration still applies.
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

server:
  port: ${IDENTITY_SERVER_PORT:9090}
  error:
    include-message: always
    include-stacktrace: never
  servlet:
    session:
      # Cookie-only — without this, Tomcat falls back to appending ;jsessionid=... to redirect
      # URLs on a client's very first request (before it knows a cookie round-tripped), and
      # Spring Security's StrictHttpFirewall rejects any URL containing ';' by default. That
      # combination turned a first-time login into a redirect to a garbled /error?continue —
      # found by actually driving the login flow in a real (cookie-less, fresh-session) browser,
      # not by reasoning about it. Cookie-only is also just better practice regardless: a session
      # id embedded in a URL leaks into server logs, browser history, and Referer headers.
      tracking-modes: cookie

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

jmouse:
  access:
    policy:
      # ⚠️ NO LOCATIONS MEANS THE FEATURE IS OFF — no bean appears at all, the document is never read,
      # and the seed never runs. A location that IS configured and matches nothing is the opposite case
      # and refuses to start, which is the failure worth having: somebody asked for a file.
      name: identity
      locations:
        - classpath:policy/identity.jmp

identity:
  issuer: ${IDENTITY_ISSUER:http://localhost:9090}

  bootstrap:
    # Who holds the way back in — the one assignment the policy document makes rather than a screen,
    # because the screen is behind it.
    #
    # ⚠️ A DEFAULT IS SHIPPED ON PURPOSE. The document writes `${identity.bootstrap.owner}`, and a
    # placeholder with no property behind it fails the boot by the policy loader's own rule. This
    # value is the account V000001 seeds, so a fresh installation comes up with somebody able to open
    # the access screen.
    #
    # ⚠️ It may be a row id or a LOCAL email address, and it is RESOLVED to the row id before anything
    # is written — every grant here is keyed on the id. Written through unresolved it would produce an
    # assignment that parses, projects onto the access screen, and grants absolutely nothing. A handle
    # naming nobody stops the boot rather than leaving a row that looks like a grant.
    owner: ${IDENTITY_BOOTSTRAP_OWNER:ihontarenko@gmail.com}

  clients:
    # Confidential client — Innoventa hasn't migrated onto this service yet, so this entry is
    # provisional. Left exactly as-is (secret + HTTP Basic, no PKCE) when moneta below
    # was reconfigured as a public client — do not change this one without being asked.
    innoventa:
      client-id: ${IDENTITY_INNOVENTA_CLIENT_ID:innoventa-web}
      client-secret: ${IDENTITY_INNOVENTA_CLIENT_SECRET:innoventa-dev-secret}
      redirect-uri: ${IDENTITY_INNOVENTA_REDIRECT_URI:http://localhost:5010/login/oauth2/code/identity}
      post-logout-redirect-uri: ${IDENTITY_INNOVENTA_POST_LOGOUT_REDIRECT_URI:http://localhost:5010}
      audience: innoventa
      public-client: false
    # Public client — the Moneta UI is a pure browser SPA with nowhere safe to keep a
    # client secret, so it authenticates via Authorization Code + PKCE instead (no secret,
    # requireProofKey enforced in SecurityConfiguration.buildRegisteredClient). client-secret is
    # intentionally absent: a public client never presents one.
    moneta:
      client-id: ${IDENTITY_MONETA_CLIENT_ID:moneta-web}
      redirect-uri: ${IDENTITY_MONETA_REDIRECT_URI:http://localhost:5020/login/oauth2/code/identity}
      post-logout-redirect-uri: ${IDENTITY_MONETA_POST_LOGOUT_REDIRECT_URI:http://localhost:5020}
      audience: moneta
      public-client: true
    # Public client — Innoventa Central's UI, same shape as moneta above (no secret, PKCE via
    # requireProofKey). audience must read "innoventa_central" (not the shorter "central") to
    # match Central/BE's own accepted-audiences allow-list
    # (innoventa-central.security.accepted-audiences, see Central/src/main/resources/
    # application.yml) — a mismatch here means every authenticated API call 401s no matter how
    # fresh the token is, which used to cascade into an infinite signin-redirect loop via
    # Central/UI's httpClient.ts response interceptor (any 401 → signinRedirect()). Found by
    # tracing that interceptor, not by guessing.
    central:
      client-id: ${IDENTITY_CENTRAL_CLIENT_ID:innoventa_central-web}
      redirect-uri: ${IDENTITY_CENTRAL_REDIRECT_URI:http://localhost:5210/login/oauth2/code/identity}
      post-logout-redirect-uri: ${IDENTITY_CENTRAL_POST_LOGOUT_REDIRECT_URI:http://localhost:5210}
      audience: innoventa_central
      public-client: true
    # Public client — Tessera's UI (the Jira-style tracker), same shape as moneta/central above
    # (no secret, PKCE via requireProofKey). audience "tessera" is what Tessera/BE's own
    # SecurityConfiguration.jwtDecoder requires (tessera.security.audience), and must also be present
    # in Central's accepted-audiences allow-list for Tessera to read shared translations.
    tessera:
      client-id: ${IDENTITY_TESSERA_CLIENT_ID:tessera-web}
      redirect-uri: ${IDENTITY_TESSERA_REDIRECT_URI:http://localhost:5050/login/oauth2/code/identity}
      post-logout-redirect-uri: ${IDENTITY_TESSERA_POST_LOGOUT_REDIRECT_URI:http://localhost:5050}
      audience: tessera
      public-client: true
    # Public client — WiQ's UI (the knowledge product), same shape as the four above. audience "wiq" is
    # what WiQ/BE's own SecurityConfiguration.jwtDecoder requires (wiq.security.audience).
    #
    # ⚠️ ONE AUDIENCE FOR SEVERAL CALLERS, and that is WiQ's whole architecture rather than an oversight.
    # Tessera's wiki tab and Innoventa's pages call WiQ DIRECTLY FROM THE BROWSER, carrying the reader's
    # own token — so what arrives at 8110 is always a `wiq` token minted for this client, whichever
    # product's interface the person happens to be looking at. There is no token relay and no
    # product-to-product secret anywhere on that path (WIQ-1 §1). What makes those cross-origin calls
    # work is CORS on WiQ's side, not a second registration here.
    #
    # ⚠️ NOT in Central's accepted-audiences, unlike `tessera`. WiQ does not use Central at all — its
    # `t(key, fallback)` is backed by a local provider that returns the fallback (WIQ-1 §15) — so adding
    # it there would grant a reach nothing asks for.
    wiq:
      client-id: ${IDENTITY_WIQ_CLIENT_ID:wiq-web}
      redirect-uri: ${IDENTITY_WIQ_REDIRECT_URI:http://localhost:5060/login/oauth2/code/identity}
      post-logout-redirect-uri: ${IDENTITY_WIQ_POST_LOGOUT_REDIRECT_URI:http://localhost:5060}
      audience: wiq
      public-client: true
    # ⚠️ UNUSED, AND IT CANNOT BE USED — kept only so nobody registers it a second time.
    #
    # A Model Context Protocol client has nowhere to be told a client id: it reads the authorization
    # server's metadata and registers ITSELF (RFC 7591), and absent a `registration_endpoint` it refuses
    # outright — Claude Code fails with "Incompatible auth server: does not support dynamic client
    # registration" after every other discovery step has succeeded. Identity has no such endpoint, so this
    # entry was never reachable by the thing it was written for.
    #
    # Tessera therefore issues its own credential for its own protocol endpoint, confined to it — see
    # Tessera/docs/adr/0020-tessera-issues-its-own-protocol-credential.md. Deleting this block would be
    # correct; it stays because the reasoning above is the useful part, and this is where somebody will
    # look for it.
    #
    # The original intent, for the record: public and PKCE like the browser clients, and the same
    # `tessera` audience, because it reaches the same resource server.
    #
    # ⚠️ A LOOPBACK REDIRECT, and the literal address matters. A native client opens the system browser
    # and listens on 127.0.0.1 on a port it cannot know in advance; Spring Authorization Server matches
    # a registered loopback URI ignoring the port, per RFC 8252 §7.3 — but only for the literal
    # 127.0.0.1 or [::1]. Written `localhost` it would be compared literally and never match.
    #
    # ⚠️ NO post-logout-redirect-uri, on purpose. There is no session to end: the client holds a token,
    # and RP-initiated logout is a browser flow it has no browser for.
    tessera-mcp:
      client-id: ${IDENTITY_TESSERA_MCP_CLIENT_ID:tessera-mcp}
      redirect-uri: ${IDENTITY_TESSERA_MCP_REDIRECT_URI:http://127.0.0.1/callback}
      audience: tessera
      public-client: true

logging:
  level:
    net.innoventa.identity: DEBUG
    org.springframework.security: WARN
    org.flywaydb: INFO
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level){highlight} %clr([%15.15t]){faint} %clr(%-40.40logger{36}){cyan} : %msg%n"

---
spring:
  config:
    activate:
      on-profile: postgresql
  flyway:
    locations: classpath:db/migration/postgresql
    out-of-order: true
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${IDENTITY_DB_USERNAME:identity}
    password: ${IDENTITY_DB_PASSWORD:identity}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
